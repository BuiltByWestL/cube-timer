<!doctype html>
<html lang="en" data-mode="dark" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a13">
<title>Cube Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ebebe9'/%3E%3Ccircle cx='16' cy='17' r='7.5' fill='none' stroke='%23111' stroke-width='2.4'/%3E%3Cpath d='M16 13v4.4l3 1.8' stroke='%23111' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Crect x='14' y='5.5' width='4' height='2' rx='1' fill='%23111'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="fallbackBg" aria-hidden="true"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>

<div id="app" data-phase="idle" data-press="none">
  <header class="topbar chrome">
    <div class="group">
      <button class="pill" id="eventBtn" aria-haspopup="true"><span id="eventLabel">3×3</span><svg class="chev" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4"/></svg></button>
      <button class="pill" id="sessionBtn" aria-haspopup="true"><span id="sessionLabel">Session 1</span><svg class="chev" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4"/></svg></button>
    </div>
    <div class="group">
      <button class="icon" id="btnSolves" title="Solves  (H)" aria-label="Solves"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <button class="icon" id="btnLook" title="Appearance  (T)" aria-label="Appearance"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" class="fill"/></svg></button>
      <button class="icon" id="btnSettings" title="Settings  (S)" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M5 8h9M18 8h1M5 16h1M10 16h9"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg></button>
    </div>
  </header>

  <main id="stage">
    <section id="scrambleWrap" class="chrome">
      <button class="icon sm" id="prevScr" title="Previous scramble  (←)" aria-label="Previous scramble"><svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg></button>
      <div id="scramble" aria-live="polite"></div>
      <button class="icon sm" id="nextScr" title="Next scramble  (→)" aria-label="Next scramble"><svg viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></svg></button>
    </section>

    <section id="center">
      <div id="timer" role="timer" aria-live="off">0.00</div>
      <input id="typeInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0.00" aria-label="Type a time and press Enter" hidden>
      <div id="sub"></div>
      <div id="actions" class="chrome" hidden>
        <button class="chip" id="actPlus2">+2</button>
        <button class="chip" id="actDnf">DNF</button>
        <button class="chip" id="actDel">Delete</button>
      </div>
    </section>

    <section id="statline" class="chrome"></section>
  </main>

  <ol id="recent" class="chrome" aria-label="Recent times"></ol>
  <div id="preview" class="chrome"></div>

  <aside id="panel" class="chrome" aria-hidden="true">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="solves">Solves</button>
      <button role="tab" data-tab="look">Appearance</button>
      <button role="tab" data-tab="settings">Settings</button>
      <span class="ink" aria-hidden="true"></span>
      <button class="icon sm close" id="panelClose" aria-label="Close panel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="scroll">
      <section data-pane="solves"></section>
      <section data-pane="look"></section>
      <section data-pane="settings"></section>
    </div>
  </aside>
</div>

<div id="popover" hidden></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/scramblers.js"></script>
<script src="js/preview.js"></script>
<script src="js/stats.js"></script>
<script src="js/themes.js"></script>
<script src="js/background.js"></script>
<script src="js/app.js"></script>
</body>
</html>
